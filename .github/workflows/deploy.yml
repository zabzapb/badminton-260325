name: Deploy to Firebase
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build
        run: |
          npm ci
          cd functions && npm ci && cd ..
          npm run build

      - name: Authenticate Google Cloud Service Account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HCTCPLAYER }}

      - name: Deploy to Firebase (Hosting & Functions)
        run: npx firebase-tools deploy --project hctcplayer --non-interactive
