name: Deploy to Firebase (Hosting & Functions)
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build
        run: |
          npm ci
          cd functions && npm ci && cd ..
          npm run build

      - name: Create GCP Credentials File
        run: |
          node -e 'fs.writeFileSync(process.env.KEY_PATH, process.env.KEY_DATA)'
        env:
          KEY_PATH: '${{ github.workspace }}/gcp-key.json'
          KEY_DATA: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HCTCPLAYER }}'

      - name: Deploy to Firebase (Hosting & Functions)
        run: npx firebase-tools deploy --project hctcplayer --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: '${{ github.workspace }}/gcp-key.json'

      - name: Cleanup GCP Credentials File
        if: always()
        run: rm -f '${{ github.workspace }}/gcp-key.json'
