name: Deploy to Firebase
on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm ci
          cd functions && npm ci && cd ..

      - name: Build Web App
        run: npm run build

      - name: Write GCP Key
        run: |
          echo "$SA_KEY" > key.json
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HCTCPLAYER }}

      - name: Deploy to Firebase (Functions + Hosting)
        run: npx firebase-tools deploy --project hctcplayer --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: key.json

      - name: Cleanup Key
        if: always()
        run: rm -f key.json
