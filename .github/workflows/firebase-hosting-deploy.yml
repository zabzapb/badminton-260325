name: Deploy to Firebase Hosting & Functions on Push

on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Root & Functions Dependencies
        run: |
          npm install
          cd functions && npm install && cd ..

      - name: Build Web App
        run: npm run build

      - name: Deploy to Firebase (Hosting & Functions)
        uses: w9jds/firebase-action@master
        with:
          args: deploy
        env:
          GCP_SA_KEY: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HCTCPLAYER }}'
